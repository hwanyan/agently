# ============================================================
# Agently 应用配置文件
# ============================================================
#

# HTTP 服务配置（grpc-gateway 对外暴露的 REST/SSE 网关）
http:
  port: 8090          # 网关端口号
  host: "0.0.0.0"     # 服务监听的主机地址（默认监听所有主机）

# gRPC 服务配置（系统内部核心服务层，仅供本机 HTTP 网关回环反向代理，不对外暴露）
grpc:
  port: 50050         # gRPC 端口号（留空或 0 则默认取 http.port + 1）
  host: "127.0.0.1"   # 仅监听回环：外部流量统一经 HTTP 网关进入；无需对外提供原生 gRPC

# A2A（Agent-to-Agent）协议服务配置
# 将每个业务 Agent 暴露为符合 a2a-protocol.org 协议的独立端点，供其他 AI Agent 互操作调用。
a2a:
  host: "0.0.0.0"       # A2A 服务监听地址（默认监听所有主机）
  port: 9090            # A2A 服务端口（0 表示不启动 A2A 服务）
  public_url: "https://***.com/"        # 对外可达基础 URL（用于 AgentCard 的 url 字段），给第三方使用必须配置；留空则按 localhost:port 本机推导（仅限本地/内网直连测试）
  tenants: []            # 鉴权租户列表：Agently 一方预先为每个调用方分配 tenant_id + token，写入本配置；
                         # 调用方请求时必须同时携带 X-A2A-Tenant-Id 与 Authorization: Bearer <token> 二者，
                         # 服务端按 tenant_id 精确查找、比对 token，二者缺一不可。为空表示不启用鉴权（仅限本地/内网调试）。示例：
                         # tenants:
                         #   - tenant_id: "partner-a"
                         #     token: "xxxxxxxx"
                         #   - tenant_id: "partner-b"
                         #     token: "yyyyyyyy"

# 数据库配置（PostgreSQL）
database:
  dsn: "postgres://agently:*******@localhost:5432/agentlydb?sslmode=disable"  # 请修改为实际的数据库连接信息
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 300

# JWT 认证配置
jwt:
  secret: "*******"    # TODO: 请填写 JWT 签名密钥（生产环境必须设置强随机值）
  expire_hour: 72

# SMTP 邮件配置（用于发送验证码）
smtp:
  host: ""             # SMTP 服务器地址，如 smtp.qq.com（留空则验证码打印到控制台）
  port: 587            # SMTP 端口，587(TLS) 或 465(SSL)
  username: ""         # SMTP 登录用户名（通常是邮箱地址）
  password: ""         # SMTP 登录密码或授权码
  from: ""             # 发件人地址（可选，默认使用 username）

# LLM 大语言模型配置
llm:
  provider: "deepseek"
  api_key: "*******"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"

# 工具配置
tools:
  # 天气工具
  weather:
    api_key: "*******"
    base_url: "https://apis.juhe.cn/simpleWeather/query"

  # IP 地址查询工具
  ip:
    access_key: "*******"

  # 翻译工具
  translate:
    api_key: ""
    base_url: "https://libretranslate.com"

# MCP 工具配置
#
# 设计说明：
#   - id   ：稳定标识，被 Agent 的 prompt.yaml 中 tools.mcp_servers 引用，**不要随意修改**
#   - name ：仅用于日志/前端展示，可随意修改，不会影响绑定关系
mcp:
  servers:
    - id: "gold_analysis"
      name: "黄金分析 MCP 服务"
      base_url: "http://localhost:9091"
      api_key: ""
      timeout: 60

    - id: "news_analysis"
      name: "新闻分析 MCP 服务"
      base_url: "http://localhost:9092"
      api_key: ""
      timeout: 60
