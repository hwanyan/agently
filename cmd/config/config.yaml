# ============================================================
# Agently 应用配置文件
# ============================================================

# 日志配置
log:
  file_path: "../../logs/agently" # 日志文件的路径和前缀

# HTTP 服务配置
http:
  port: 8080
  host: "0.0.0.0"

# 数据库配置（PostgreSQL）
database:
  dsn: "postgres://agently:*******@localhost:5432/agentlydb?sslmode=disable"  # 请修改为实际的数据库连接信息
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 300

# JWT 认证配置
jwt:
  secret: "*******"          # TODO: 请填写 JWT 签名密钥（生产环境必须设置强随机值）
  expire_hour: 72

# LLM 大语言模型配置
llm:
  provider: "deepseek"
  api_key: "*******"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"

# 工具配置
tools:
  # 天气工具（和风天气）
  weather:
    api_key: "*******"
    base_url: "https://p86yvy2tea.re.qweatherapi.com"

  # IP 地址查询工具
  ip:
    access_key: "*******"

  # 翻译工具
  translate:
    api_key: ""
    base_url: "https://libretranslate.com"

# MCP 工具配置
mcp:
  servers:
    - name: "gold-analysis-mcp-server"
      base_url: "http://localhost:9090"
      api_key: ""
      timeout: 30
