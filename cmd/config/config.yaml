# ============================================================
# Agently 应用配置文件
# ============================================================

# 日志配置
log:
  file_path: "../../logs/agently" # 日志文件的路径和前缀

# HTTP 服务配置
http:
  port: 8080      # 服务端口号
  host: "0.0.0.0" # 服务监听的主机地址（所有主机）

# 数据库配置（PostgreSQL）
database:
  dsn: "postgres://agently:*******@localhost:5432/agentlydb?sslmode=disable"  # 请修改为实际的数据库连接信息
  max_open_conns: 20
  max_idle_conns: 5
  conn_max_lifetime: 300

# JWT 认证配置
jwt:
  secret: "*******"          # TODO: 请填写 JWT 签名密钥（生产环境必须设置强随机值）
  expire_hour: 72

# SMTP 邮件配置（用于发送验证码）
smtp:
  host: ""                   # SMTP 服务器地址，如 smtp.qq.com（留空则验证码打印到控制台）
  port: 587                  # SMTP 端口，587(TLS) 或 465(SSL)
  username: ""               # SMTP 登录用户名（通常是邮箱地址）
  password: ""               # SMTP 登录密码或授权码
  from: ""                   # 发件人地址（可选，默认使用 username）

# LLM 大语言模型配置
llm:
  provider: "deepseek"
  api_key: "*******"
  model: "deepseek-chat"
  base_url: "https://api.deepseek.com/v1"

# 工具配置
tools:
  # 天气工具（和风天气）
  weather:
    api_key: "*******"
    base_url: "https://p86yvy2tea.re.qweatherapi.com"

  # IP 地址查询工具
  ip:
    access_key: "*******"

  # 翻译工具
  translate:
    api_key: ""
    base_url: "https://libretranslate.com"

# MCP 工具配置
mcp:
  servers:
    - name: "gold-analysis-mcp-server"
      base_url: "http://localhost:9090"
      api_key: ""
      timeout: 30
